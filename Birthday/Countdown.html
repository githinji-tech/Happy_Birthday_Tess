<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #d8b4fe, #f472b6, #fb7185, #c084fc);
            background-size: 300% 300%;
            animation: ambientGlow 18s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        @keyframes ambientGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            color: #333;
        }

        h1 {
            color: #f43f5e;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .countdown {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: linear-gradient(135deg, #f43f5e 0%, #a855f7 100%);
            color: white;
            padding: 30px 20px;
            border-radius: 10px;
            flex: 1;
            min-width: 80px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
        }

        .countdown-number {
            font-size: 2.5em;
            font-weight: bold;
            display: block;
        }

        .countdown-label {
            font-size: 0.9em;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .message {
            color: #f43f5e;
            font-size: 1.2em;
            margin-top: 30px;
            font-weight: bold;
        }

        .birthday-date {
            color: #666;
            font-size: 1.1em;
            margin-top: 20px;
        }

        .emoji {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .open-page-btn {
            margin-top: 24px;
            padding: 12px 24px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #f43f5e 0%, #a855f7 100%);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .open-page-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
        }

        .open-page-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .countdown-item {
                min-width: 60px;
                padding: 20px 10px;
            }

            .countdown-number {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🎂</div>
        <h1>Countdown</h1>
        <div class="birthday-date" id="birthdayDate">Loading...</div>
        
        <div class="countdown" id="countdown">
            <div class="countdown-item">
                <span class="countdown-number" id="days">0</span>
                <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="hours">0</span>
                <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="minutes">0</span>
                <span class="countdown-label">Minutes</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="seconds">0</span>
                <span class="countdown-label">Seconds</span>
            </div>
        </div>

        <div class="message" id="message"></div>
        <button class="open-page-btn" id="openPageButton" type="button" onclick="window.location.href='index.html'" disabled>Open Birthday Surprise</button>
    </div>

    <script>
        const birthdayDate = new Date(2026, 6, 30, 0, 0, 0).getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = birthdayDate - now;

            const openPageButton = document.getElementById('openPageButton');

            if (distance < 0) {
                document.getElementById('message').textContent = '🎉 Happy Birthday! 🎉';
                document.getElementById('countdown').innerHTML = '<div class="message">The birthday is here!</div>';
                openPageButton.disabled = false;
                openPageButton.textContent = 'Open Birthday Surprise';
                return;
            }

            openPageButton.disabled = true;
            openPageButton.textContent = 'Waiting for birthday...';

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            document.getElementById('message').textContent = 'Time until the big day!';
            
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('birthdayDate').textContent =
                new Date(birthdayDate).toLocaleDateString('en-US', options);
        }

        // Update countdown immediately
        updateCountdown();

        // Update countdown every second
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
